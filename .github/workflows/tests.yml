name: tests

on: [push, pull_request]

jobs:
  documentation-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_docs_links.py

  registry-builder:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qnl_format_registry_builder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q

  preservation-risk-manager:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: preservation_risk_manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m preservation_risk_manager --help
      - run: pytest -q
