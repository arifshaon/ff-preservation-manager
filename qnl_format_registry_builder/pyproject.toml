[project]
name = "qnl-format-registry-builder"
version = "0.1.0"
description = "Repeatable pipeline for building and updating a local file-format registry from authoritative sources."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["registry_builder*"]
exclude = ["config*", "output*", "work*", "tests*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
