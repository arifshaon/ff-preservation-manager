[project]
name = "preservation-risk-manager"
version = "0.1.0"
description = "Institution-specific preservation risk posture and action-policy manager."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
preservation-risk-manager = "preservation_risk_manager.cli:main"
preservation-risk-web = "preservation_risk_manager.web_cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "fastapi>=0.115", "httpx>=0.27"]
ai = ["openai>=1.42"]
web = ["fastapi>=0.115", "uvicorn>=0.30"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["preservation_risk_manager*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
