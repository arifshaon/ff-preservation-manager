[project]
name = "preservation-risk-manager"
version = "0.1.0"
description = "Institution-specific preservation risk posture and action-policy manager."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
preservation-risk-manager = "preservation_risk_manager.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]
ai = ["openai>=1.42"]
# PDF text extraction for the literature corpus. Plain text and OCR output
# (.txt/.md) are ingested without this extra.
corpus = ["pypdf>=4"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["preservation_risk_manager*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
